version: "3.8"

services:
  # ========================================================
  # 1. MongoDB Database (Primary Persistence)
  # ========================================================
  mongodb:
    image: mongo:latest
    container_name: hilokal-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword123
      MONGO_INITDB_DATABASE: hilokal_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - hilokal-network

  # ========================================================
  # 2. Redis (Caching, Presence, PubSub, Queues)
  # ========================================================
  redis:
    image: redis:alpine
    container_name: hilokal-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispassword123 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hilokal-network

  # ========================================================
  # 3. MinIO (S3-Compatible Object Storage for Images/Audio)
  # ========================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: hilokal-minio
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - hilokal-network

  # Helper service: Automatically creates required MinIO buckets
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: hilokal-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword123;
      /usr/bin/mc mb --ignore-existing myminio/avatars;
      /usr/bin/mc mb --ignore-existing myminio/audio-bios;
      /usr/bin/mc mb --ignore-existing myminio/room-banners;
      /usr/bin/mc anonymous set download myminio/avatars;
      /usr/bin/mc anonymous set download myminio/room-banners;
      exit 0;
      "
    networks:
      - hilokal-network

  # ========================================================
  # 4. LiveKit WebRTC Audio Server (SFU)
  # ========================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: hilokal-livekit
    restart: always
    ports:
      - "7880:7880"         # Signaling & HTTP
      - "7881:7881"         # WebRTC TCP fallback
      - "50000-50050:50000-50050/udp" # WebRTC UDP traffic
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    networks:
      - hilokal-network

networks:
  hilokal-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  minio_data:
