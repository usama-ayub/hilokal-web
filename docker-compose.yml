version: "3.8"

services:
  # ========================================================
  # 1. MongoDB Database (Primary Persistence)
  # ========================================================
  mongodb:
    image: mongo:latest
    container_name: hilokal-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword123
      MONGO_INITDB_DATABASE: hilokal_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - hilokal-network

  # ========================================================
  # 2. Redis (Caching, Presence, PubSub, Queues)
  # ========================================================
  redis:
    image: redis:alpine
    container_name: hilokal-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispassword123 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hilokal-network

  # ========================================================
  # 3. LiveKit WebRTC Audio Server (SFU)
  # ========================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: hilokal-livekit
    restart: always
    ports:
      - "7880:7880"         # Signaling & HTTP
      - "7881:7881"         # WebRTC TCP fallback
      - "50000-50050:50000-50050/udp" # WebRTC UDP traffic
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    networks:
      - hilokal-network

networks:
  hilokal-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
